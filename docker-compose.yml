# One command to run everything:  docker compose up --build
# App: http://localhost:8080   (demo login: demo@assistant.dev / demo1234)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo, ai-service]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/personal_assistant
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:8080
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      SEED_DEMO: "true"
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "8080:80"

volumes:
  mongo-data:
