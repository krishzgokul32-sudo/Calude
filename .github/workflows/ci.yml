# Runs on every push and pull request (TRACEN guide §10: automated tests before deploy).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit + integration tests (real MongoDB)
        run: npm test
        env:
          TEST_MONGO_URI: mongodb://localhost:27017
      - name: Boot the API and check it is ready
        run: |
          node src/index.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5000/api/health/ready && exit 0; sleep 1; done
          cat api.log; exit 1
        env:
          MONGO_URI: mongodb://localhost:27017/gk_ci
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
