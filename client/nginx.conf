# Docker's DNS, so scaled API copies (docker compose --scale server=3) are all found.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade only when the client asks for it; otherwise keep-alive to the API.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

# Keep https when a proxy in front (Caddy) already terminated TLS; otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

upstream gk_api {
  zone gk_api 64k;
  server server:5000 resolve;
  keepalive 32;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # MCP tool calls can carry larger inputs; everything else stays small.
  client_max_body_size 5m;

  # Compress text responses (guide §05: bandwidth).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # All proxy headers live here. NOTE: if a location sets any proxy_set_header of its own, nginx drops
  # every header below for that location (client IPs would be lost and IP rate limits would lump all
  # users together), so locations must not set their own.
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Request-Id $request_id;
  proxy_connect_timeout 5s;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;

  location /api/ {
    proxy_pass http://gk_api;
    proxy_read_timeout 180s; # the assistant may think for a while
  }

  location /socket.io/ {
    proxy_pass http://gk_api;
    proxy_read_timeout 1h;
  }

  # Hashed build files never change: cache them for a year (guide §06: broken after deploy).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh, so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
